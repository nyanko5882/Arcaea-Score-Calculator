<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Arcaea Score Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <input id="input-maxcombo" type="number" min="1">
        <div id="panel-far">
            <input type="range" min="0" id="input-far-range">
            <input type="number" min="0" id="input-far">
        </div>
        <div id="panel-lost">
            <input type="range" min="0" id="input-lost-range">
            <input type="number" min="0" id="input-lost">
        </div>
        <p id="score-display">Score: <span id="score"></span></p>
        <script src="script.js"></script>
    </body>
</html>
