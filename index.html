<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Arcaea Score Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <p id="score-display">Score: <span id="score">10000000</span></p>
        <hr>
        <input id="input-maxcombo" type="number" min="1" placeholder="最大コンボ数を入力">
        <div id="panel-far">
            <span>FAR: <input type="number" min="0" id="input-far" class="input-judge" value="0"></span>
            <input type="range" min="0" id="input-far-slider" class="input-judge-slider" value="0">
        </div>
        <div id="panel-lost" class="judge-panel">
            <span>LOST: <input type="number" min="0" id="input-lost" class="input-judge" value="0"></span>
            <input type="range" min="0" id="input-lost-slider" class="input-judge-slider" value="0">
        </div>
        <script src="script.js"></script>
    </body>
</html>
